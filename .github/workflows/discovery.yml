name: Discovery (07:00 / 19:00 IST)

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST — captures the full US working day
    - cron: '30 13 * * *'  # 19:00 IST — captures India and European working day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (fail fast before touching the Sheet)
        run: npm test
      - name: Run discovery → score → Sheet → digest
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: npm run discover
      - name: Commit state (first-seen, velocity history, shortlist, JDs)
        if: always()
        run: |
          git config user.name "job-search-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: discovery run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Email the owner if anything above crashed
        if: failure()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: npm run notify:failure -- "Discovery workflow failed — open the Actions log"
