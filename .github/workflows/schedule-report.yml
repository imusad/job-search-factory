name: Run-time optimisation report (JSF-503)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 4 * * 1'   # Mondays 09:30 IST
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node src/cli/schedule-report.js >> "$GITHUB_STEP_SUMMARY"
